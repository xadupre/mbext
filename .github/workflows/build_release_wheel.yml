name: Build Release Wheels

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to build (without the refs/tags/ prefix)."
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-refs/tags/${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git check-ref-format "refs/tags/${RELEASE_TAG}"
          git show-ref --verify "refs/tags/${RELEASE_TAG}"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install build
      - name: Build package
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Attach distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view -- "${RELEASE_TAG}" >/dev/null; then
            gh release create --verify-tag --title "${RELEASE_TAG}" --notes "" -- "${RELEASE_TAG}"
          fi
          gh release upload --clobber -- "${RELEASE_TAG}" dist/*.whl dist/*.tar.gz
