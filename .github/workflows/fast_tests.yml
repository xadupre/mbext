name: Fast Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  onnx-light-wheels:
    name: onnx-light wheel (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package from wheel dependencies
        run: pip install .
      - name: Check native graph builder
        run: python -c "from onnx_light.onnx_core.graph_builder import GraphBuilder; print(GraphBuilder)"

  tests:
    name: ci (${{ matrix.os }}, py${{ matrix.python-version }}, torch-${{ matrix.torch.version || 'stable' }}, transformers-${{ matrix.transformers-version || 'latest' }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.14"]
        transformers-version: ["4.57", "5.6", "5.12.1", "5.15.0"]
        torch:
          - version: "2.13.0"
        include:
          - transformers-version: "4.57"
            onnxruntime-genai-version: "0.15.1"
            tokenizers-version: "0.22.2"
          - transformers-version: "5.6"
            onnxruntime-genai-version: "0.15.1"
            tokenizers-version: "0.23.0rc0"
          - transformers-version: "5.12.1"
            onnxruntime-genai-version: "0.15.1"
            tokenizers-version: "0.23.0rc0"
          - transformers-version: "5.15.0"
            onnxruntime-genai-version: "0.15.2"
            tokenizers-version: "0.23.0rc0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # we install torch first to avoid downloading any CUDA dependency

      - name: Install nightly pytorch
        if: matrix.torch.version == 'nightly'
        run: pip install --pre --upgrade torch torchvision torchaudio --index-url https://download.pytorch.org/whl/nightly/cpu

      - name: Install pytorch ${{ matrix.torch.version }} (Linux/Windows)
        if: matrix.torch.version != 'nightly' && matrix.os != 'macos-latest'
        run: pip install "torch==${{ matrix.torch.version }}+cpu" torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        if: matrix.transformers-version != '4.57'
        run: pip install -e ".[dev]" torch "transformers==${{ matrix.transformers-version }}" "tokenizers==${{ matrix.tokenizers-version }}" "onnxruntime-genai==${{ matrix.onnxruntime-genai-version }}"

      - name: Install dependencies (transformers 4.57)
        if: matrix.transformers-version == '4.57'
        run: >-
          pip install -e "."
          torch
          "black==26.5.1"
          "mypy==2.3.0"
          "onnxruntime==1.28.0"
          "onnxruntime-genai==${{ matrix.onnxruntime-genai-version }}"
          "openpyxl==3.1.5"
          "pandas==3.0.5"
          "peft==0.20.0"
          "py-cpuinfo==9.0.0"
          "pyrefly==1.2.0"
          "pytest==9.1.1"
          "pytest-cov==7.1.0"
          "pytest-subtests==0.15.0"
          "pytest-timeout==2.4.0"
          "ruff==0.16.3"
          "tabulate==0.10.0"
          "tokenizers==${{ matrix.tokenizers-version }}"
          "transformers==${{ matrix.transformers-version }}"

      - name: pip freeze
        run: pip freeze

      - name: Run fast tests
        run: DOCLEAN=1&&pytest tests/fast -v --cov=modelbuilder --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: fast-tests

      - name: Upload stats artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stats-${{ matrix.os }}-py${{ matrix.python-version }}-torch${{ matrix.torch.version }}-transformers${{ matrix.transformers-version }}
          path: stats/
          if-no-files-found: ignore
