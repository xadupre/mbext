name: Documentation

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    name: build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Install a CPU-only torch first to avoid pulling CUDA dependencies. The
      # gallery examples build tiny random-weight models, so CPU is enough.
      - name: Install pytorch (CPU)
        run: pip install "torch==2.14.1+cpu" torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -e ".[dev,doc]" transformers tokenizers "huggingface_hub>=2.2.0"

      - name: pip freeze
        run: pip freeze

      - name: Build documentation
        run: sphinx-build -b html --keep-going docs docs/_build/html

      - name: Upload documentation artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/_build/html
          if-no-files-found: warn

  report-failure:
    name: Report documentation failure
    needs: build-docs
    if: ${{ failure() && needs.build-docs.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              ...context.repo,
              title: "Documentation build failed",
              body: [
                "The documentation workflow failed.",
                "",
                `Workflow run: ${runUrl}`,
                `Commit: ${context.sha}`,
              ].join("\n"),
            });
