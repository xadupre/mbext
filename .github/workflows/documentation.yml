name: Documentation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-docs:
    name: build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Install a CPU-only torch first to avoid pulling CUDA dependencies. The
      # gallery examples build tiny random-weight models, so CPU is enough.
      - name: Install pytorch (CPU)
        run: pip install "torch==2.13.0+cpu" torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -e ".[dev,doc]" transformers tokenizers

      - name: pip freeze
        run: pip freeze

      - name: Build documentation
        run: sphinx-build -b html --keep-going docs docs/_build/html

      - name: Upload documentation artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/_build/html
          if-no-files-found: warn
