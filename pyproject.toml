[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modelbuilder"
version = "0.1.0"
description = "Writes LLM in ONNX format."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "ml_dtypes>=0.6.0",
    "numpy>=2.5.2",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.27/onnx_light-0.1.27-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.27/onnx_light-0.1.27-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl ; python_version == '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.27/onnx_light-0.1.27-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl ; python_version == '3.14' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.27/onnx_light-0.1.27-cp312-cp312-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'aarch64'",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.27/onnx_light-0.1.27-cp313-cp313-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl ; python_version == '3.13' and sys_platform == 'linux' and platform_machine == 'aarch64'",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.27/onnx_light-0.1.27-cp314-cp314-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl ; python_version == '3.14' and sys_platform == 'linux' and platform_machine == 'aarch64'",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.27/onnx_light-0.1.27-cp312-cp312-macosx_13_0_universal2.whl ; python_version == '3.12' and sys_platform == 'darwin'",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.27/onnx_light-0.1.27-cp313-cp313-macosx_13_0_universal2.whl ; python_version == '3.13' and sys_platform == 'darwin'",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.27/onnx_light-0.1.27-cp314-cp314-macosx_13_0_universal2.whl ; python_version == '3.14' and sys_platform == 'darwin'",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.27/onnx_light-0.1.27-cp312-cp312-win_amd64.whl ; python_version == '3.12' and sys_platform == 'win32' and platform_machine == 'AMD64'",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.27/onnx_light-0.1.27-cp313-cp313-win_amd64.whl ; python_version == '3.13' and sys_platform == 'win32' and platform_machine == 'AMD64'",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.27/onnx_light-0.1.27-cp314-cp314-win_amd64.whl ; python_version == '3.14' and sys_platform == 'win32' and platform_machine == 'AMD64'",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.27/onnx_light-0.1.27-cp312-cp312-win_arm64.whl ; python_version == '3.12' and sys_platform == 'win32' and platform_machine == 'ARM64'",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.27/onnx_light-0.1.27-cp313-cp313-win_arm64.whl ; python_version == '3.13' and sys_platform == 'win32' and platform_machine == 'ARM64'",
    "onnx-light @ https://github.com/xadupre/onnx-light/releases/download/0.1.27/onnx_light-0.1.27-cp314-cp314-win_arm64.whl ; python_version == '3.14' and sys_platform == 'win32' and platform_machine == 'ARM64'",
    "scipy>=1.18.0",
]

[project.optional-dependencies]
dev = [
    "black==26.5.1",
    "huggingface_hub==1.27.0",
    "mypy==2.3.0",
    "onnxruntime==1.28.0",
    "onnxruntime-genai>=0.15.1,<=0.15.2",
    "openpyxl==3.1.5",
    "pandas==3.0.5",
    "peft==0.20.0",
    "py-cpuinfo==9.0.0",
    "pyrefly==1.2.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-subtests==0.15.0",
    "pytest-timeout==2.4.0",
    "ruff==0.16.3",
    "tabulate==0.10.0",
    "tokenizers>=0.22.2,<=0.23.0rc0",
    "transformers>=5.6,<=5.15.0",
]
doc = [
    "furo==2025.12.19",
    "matplotlib==3.11.1",
    "sphinx==9.1.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-gallery==0.21.0",
]

[tool.setuptools.packages.find]
include = ["modelbuilder*"]

[tool.black]
line-length = 140
target-version = ["py312", "py313", "py314"]
skip-magic-trailing-comma = true

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "I001"]
