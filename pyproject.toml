[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modelbuilder"
version = "0.2.1"
description = "Fast Experimental Exporter for transformers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "ml_dtypes>=0.6.0",
    "numpy>=2.5.4",
    "onnx-light>=0.2.1",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
dev = [
    "black==26.10.1",
    # Older supported Transformers releases require Hub <2; latest CI tests Hub 2.2+.
    "huggingface_hub>=1.5.0",
    "mypy==2.3.0",
    "onnx-light-cpu @ https://github.com/xadupre/onnx-light-cpu/releases/download/0.2.0/onnx_light_cpu-0.2.0-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnx-light-cpu @ https://github.com/xadupre/onnx-light-cpu/releases/download/0.2.0/onnx_light_cpu-0.2.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl ; python_version == '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnx-light-cpu @ https://github.com/xadupre/onnx-light-cpu/releases/download/0.2.0/onnx_light_cpu-0.2.0-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl ; python_version == '3.14' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnx-light-cpu @ https://github.com/xadupre/onnx-light-cpu/releases/download/0.2.0/onnx_light_cpu-0.2.0-cp312-cp312-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl ; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'aarch64'",
    "onnx-light-cpu @ https://github.com/xadupre/onnx-light-cpu/releases/download/0.2.0/onnx_light_cpu-0.2.0-cp313-cp313-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl ; python_version == '3.13' and sys_platform == 'linux' and platform_machine == 'aarch64'",
    "onnx-light-cpu @ https://github.com/xadupre/onnx-light-cpu/releases/download/0.2.0/onnx_light_cpu-0.2.0-cp314-cp314-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl ; python_version == '3.14' and sys_platform == 'linux' and platform_machine == 'aarch64'",
    "onnx-light-cpu @ https://github.com/xadupre/onnx-light-cpu/releases/download/0.2.0/onnx_light_cpu-0.2.0-cp312-cp312-macosx_13_0_universal2.whl ; python_version == '3.12' and sys_platform == 'darwin'",
    "onnx-light-cpu @ https://github.com/xadupre/onnx-light-cpu/releases/download/0.2.0/onnx_light_cpu-0.2.0-cp313-cp313-macosx_13_0_universal2.whl ; python_version == '3.13' and sys_platform == 'darwin'",
    "onnx-light-cpu @ https://github.com/xadupre/onnx-light-cpu/releases/download/0.2.0/onnx_light_cpu-0.2.0-cp314-cp314-macosx_13_0_universal2.whl ; python_version == '3.14' and sys_platform == 'darwin'",
    "onnxruntime==1.30.0",
    "onnxruntime-genai<=0.17.1,>=0.17.1",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "peft==0.21.2",
    "py-cpuinfo==9.0.0",
    "pyrefly==1.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-subtests==0.15.0",
    "pytest-timeout==2.4.0",
    "ruff==0.17.1",
    "tabulate==0.10.0",
    "transformers<=5.20.2,>=5.19",
]
dev-latest-tokenizers = ["tokenizers>=0.23.3,<0.24.0"]
doc = [
    "furo==2025.12.19",
    "matplotlib==3.11.2",
    "sphinx==9.1.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-gallery==0.22.1",
]

[tool.setuptools.packages.find]
include = ["modelbuilder*"]

[tool.black]
line-length = 140
target-version = ["py312", "py313", "py314"]
skip-magic-trailing-comma = true

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "I001"]
