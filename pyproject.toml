[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "modelbuilder"
version = "0.2.1"
description = "Fast Experimental Exporter for transformers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "ml_dtypes>=0.6.0",
    "numpy>=2.5.4",
    "onnx-light>=0.2.7",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
dev = [
    "accelerate==1.15.0",
    "black==26.10.1",
    # Older supported Transformers releases require Hub <2; latest CI tests Hub 2.2+.
    "huggingface_hub>=1.5.0",
    "mypy==2.4.1",
    "onnx-light-cpu>=0.2.7; sys_platform == 'linux' or sys_platform == 'darwin'",
    "onnxruntime==1.31.1",
    "onnxruntime-genai<=0.17.1,>=0.17.1",
    "openpyxl==3.1.5",
    "pandas==3.1.1",
    "peft==0.21.2",
    "py-cpuinfo==9.0.0",
    "pyrefly==1.4.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-subtests==0.15.0",
    "pytest-timeout==2.4.0",
    "ruff==0.17.3",
    "tabulate==0.10.0",
    "transformers<=5.22.1,>=5.19",
]
dev-latest-tokenizers = ["tokenizers>=0.23.3,<0.24.0"]
doc = [
    "furo==2025.12.19",
    "matplotlib==3.11.2",
    "sphinx==9.1.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-gallery==0.22.1",
]

[tool.setuptools.packages.find]
include = ["modelbuilder*"]

[tool.black]
line-length = 140
target-version = ["py312", "py313", "py314"]
skip-magic-trailing-comma = true

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "I001"]
